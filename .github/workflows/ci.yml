name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gerador das bases simuladas (só biblioteca padrão do Python)
      - run: python -m unittest discover -s tests -p "test_*.py"
      # navegador simulado (jsdom): fluxo de contas, gastos, importação e exportação
      - run: npm test
      # leitor de extrato CSV (funções puras: separadores, aspas, valores, datas, duplicados)
      - run: npm run test:csv
      # navegador real (o Chrome já vem instalado no runner): layout, abas, menu, animação, rolagem lateral
      - run: npm run test:ui
